name: DevSecOps Frontend Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # 0. Secret Scanning (Gitleaks)
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 1. SAST & SCA (Semgrep, npm audit)
  sast-sca:
    name: SAST & SCA Analysis
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Security Check (npm audit - SCA)
        run: |
          # Affiche les vulnérabilités (SCA)
          npm audit || true

      - name: Run Semgrep (Advanced SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/javascript"
          generateSarif: "1"

  # 2. Build and Push Docker Images + Container Scan (Trivy)
  build-and-scan:
    name: Build & Container Scan (Trivy)
    needs: sast-sca
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image (Local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: frontend:temp

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frontend:temp'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Frontend Image (Release)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  # 3. Dynamic Analysis (DAST) - OWASP ZAP
  dast-scan:
    name: DAST Scan (OWASP ZAP)
    needs: build-and-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          # Cible de staging théorique (à remplacer par l'URL de Railway/Staging)
          target: 'https://humanai-staging.up.railway.app'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
